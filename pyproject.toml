[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sylva"
version = "1.16.2"
requires-python = ">=3.9"
description = "Codebase knowledge graph — AST parsing, SQLite graph, MCP server"

[project.scripts]
sylva = "sylva.__main__:main"

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]
# Package the visualisation UI's static assets (non-.py) into the wheel.
include = ["python/sylva/viz/assets/**/*"]
