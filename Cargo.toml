[package]
name = "sylva"
version = "0.3.0"
edition = "2021"
description = "Codebase knowledge graph — AST parsing, SQLite graph, MCP server"
license = "MIT"

[lib]
name = "sylva"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
