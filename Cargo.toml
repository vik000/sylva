[package]
name = "sylva"
version = "3.14.0"
edition = "2021"
description = "Codebase knowledge graph — AST parsing, SQLite graph, MCP server"
license = "MIT"

[lib]
name = "sylva"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
tree-sitter = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
serde_json = "1"
sha2 = "0.10"
notify = "6"
quick-xml = "0.36"

[profile.release]
opt-level = 3
