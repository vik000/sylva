name: CI
on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The wheel is abi3-py39, and the file watcher is OS-dependent
        # (FSEvents on macOS, inotify on Linux) — so exercise both.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry and target dir — the bundled tree-sitter /
      # rusqlite / notify builds dominate CI time.
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build/test tooling
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build the extension
        run: maturin develop

      - name: Run the test suite
        run: pytest python/tests/ -v
